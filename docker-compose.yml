services:
  db:
    image: mariadb:11
    command: mariadbd --sql_mode="" --ft_stopword_file="" --ft_min_word_len=1
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: secret
  migrate:
    image: ghcr.io/amacneil/dbmate:2.38.1
    command: up
    depends_on:
      - db
    volumes:
      - ./sql/migrations:/db/migrations
    environment:
      DATABASE_URL: mysql://root:secret@db/ifdb
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
      DBMATE_WAIT_TIMEOUT: 30m
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - ${IFDB_PMA_PORT:-8081}:80
  web:
    image: ifdb-web:${IFDB_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        PHP_VERSION: "8"
    ports:
      - ${IFDB_WEB_PORT:-8080}:80
    links:
      - db
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./www:/var/www/html
