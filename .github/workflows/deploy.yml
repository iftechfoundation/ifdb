# Deploys the commit that triggered the calling workflow (or inputs.sha), by
# running deploy-ifdb on the server over SSH. Called by test-and-deploy.yml
# after every push to main, and by deploy-prod.yml and deploy-dev.yml when run
# by hand.
#
# Repository setup (Settings > Environments), each limited to the main branch:
#
#   dev                 secrets DEPLOY_SSH_KEY, DEPLOY_SSH_TARGET,
#                       DEPLOY_KNOWN_HOSTS and SMOKE_AUTH (user:password);
#                       var SMOKE_URL (https://dev.ifdb.org/)
#   production          the deploy secrets, plus var SMOKE_URL
#                       (https://ifdb.org/)
#   approve-production  no secrets; required reviewer. Production deploys
#                       wait here when plan-deploy.sh says they need a person
#                       to look first, and so do deploy-dev.yml's deploys of
#                       branches that aren't on main.
#
# DEPLOY_SSH_TARGET is user@host, or ssh://user@host:port. The hosts are the
# servers' own IP addresses, which Cloudflare hides, so they're secrets: the
# logs are public, and GitHub masks secrets in them but not vars. The server
# side is deploy-ifdb-ci in ifdb-infra-initial.

name: Deploy

on:
  workflow_call:
    inputs:
      mode:
        description: dev, dev-branches, prod-on-merge or prod-manual (see .github/scripts/plan-deploy.sh)
        required: true
        type: string
      sha:
        description: The commit to deploy, if not the one that triggered the caller
        type: string
        default: ''
      reset-db:
        description: Restore dev's database from a production backup first
        type: boolean
        default: false
      backup-date:
        description: The backup to restore (YYYY-MM-DD); yesterday's by default
        type: string
        default: ''

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      needs-approval: ${{ steps.plan.outputs.needs-approval }}
    steps:
      - uses: actions/checkout@v5
        with:
          # History and tags without file contents, to compare with the
          # production tag.
          fetch-depth: 0
          filter: blob:none

      - id: plan
        env:
          MODE: ${{ inputs.mode }}
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/plan-deploy.sh

  approve:
    needs: plan
    if: needs.plan.outputs.needs-approval == 'true'
    runs-on: ubuntu-latest
    environment: approve-production
    steps:
      - run: echo "Approved"

  deploy:
    needs: [plan, approve]
    if: >-
      !cancelled() && needs.plan.outputs.deploy == 'true' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ startsWith(inputs.mode, 'dev') && 'dev' || 'production' }}
    concurrency:
      # deploy-ifdb also takes a lock, so dev deploys from both groups queue
      # on the server instead of replacing each other here.
      group: deploy-${{ startsWith(inputs.mode, 'prod') && 'production' || inputs.mode }}
      cancel-in-progress: false
    steps:
      - name: Deploy ${{ inputs.sha || github.sha }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
          SHA: ${{ inputs.sha || github.sha }}
          RESET_DB: ${{ inputs.reset-db }}
          BACKUP_DATE: ${{ inputs.backup-date }}
        run: |
          # GitHub masks the whole secret, but ssh's errors print the bare host.
          host=${SSH_TARGET#ssh://}
          host=${host#*@}
          echo "::add-mask::${host%:*}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # deploy-ifdb-ci on the server reads these from the command line.
          args=("$SHA")
          if [ "$RESET_DB" = true ]; then
            args+=(reset-db)
            if [ -n "$BACKUP_DATE" ]; then args+=("$BACKUP_DATE"); fi
          fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=60 "$SSH_TARGET" "${args[*]}"

      - name: Move the production tag
        if: ${{ !startsWith(inputs.mode, 'dev') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/production" \
              -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/production -f sha="$SHA"

      - name: Check the site
        if: vars.SMOKE_URL != ''
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
          SMOKE_AUTH: ${{ secrets.SMOKE_AUTH }}
        run: |
          auth=()
          if [ -n "$SMOKE_AUTH" ]; then auth=(--user "$SMOKE_AUTH"); fi
          curl -fsS --retry 3 --retry-delay 5 "${auth[@]}" -o home.html "$SMOKE_URL"
          grep -q 'Welcome to IFDB' home.html
